<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
<title>IELTS Speaking Practice</title>
<style>
:root{
  --paper:#f7f5ef;--ink:#343332;--muted:#77736f;--accent:#c56f58;
  --accent-dark:#9f5846;--line:#4a4744;--soft:#ece7df;--white:#fffdf8
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Segoe UI",sans-serif;
  line-height:1.72
}
button,input,select{font:inherit}
button{color:inherit}
.page{max-width:980px;margin:auto;padding:34px 24px 72px}
.topline{
  display:flex;justify-content:space-between;align-items:center;gap:18px;
  padding-bottom:14px;border-bottom:2px solid var(--line);
  color:var(--muted);font-size:13px;letter-spacing:.12em
}
.hero{padding:66px 0 38px}
h1{
  font-size:clamp(54px,10vw,112px);line-height:.9;margin:0 0 20px;
  letter-spacing:-.06em;font-weight:900
}
h1 .accent{color:var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:14px;color:var(--muted)}

.part-tabs{
  display:grid;grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin:0 0 34px
}
.part-tab{
  appearance:none;border:0;border-right:1px solid #bbb4aa;background:transparent;
  padding:17px 12px;cursor:pointer;font-weight:800;font-size:15px
}
.part-tab:last-child{border-right:0}
.part-tab:hover{background:#f0ebe4}
.part-tab.active{background:var(--ink);color:var(--paper)}
.part-tab .part-count{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:1px}

.library{
  background:var(--white);border-top:10px solid var(--accent);padding:26px;
  box-shadow:0 9px 30px rgba(40,37,34,.06);margin-bottom:34px
}
.library-title{
  display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px
}
.library-title h2{font-size:25px;margin:0}
.library-count{font-size:13px;color:var(--muted)}
.controls{display:grid;grid-template-columns:.8fr 1.35fr;gap:12px}
.control{display:grid;gap:6px}
.control label{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted)}
select,input{
  width:100%;border:1px solid #b8aea5;border-radius:12px;background:#fffdf8;
  color:var(--ink);padding:12px 14px;outline:none
}
select:focus,input:focus{border-color:var(--accent)}
.search-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:12px}
.clear-btn{
  border:1px solid #b8aea5;border-radius:12px;background:transparent;
  padding:0 15px;cursor:pointer;font-weight:700
}
.clear-btn:hover{border-color:var(--accent)}
.results{display:grid;gap:10px;margin-top:16px}
.result-card{
  width:100%;text-align:left;border:1px solid #d6cec4;background:#faf7f1;
  padding:14px 16px;border-radius:12px;cursor:pointer
}
.result-card:hover{border-color:var(--accent)}
.result-card strong{display:block;font-size:15px;margin:3px 0}
.result-meta{font-size:12px;color:var(--accent-dark);font-weight:800;letter-spacing:.06em}
.empty{
  padding:30px 18px;text-align:center;border:1px dashed #c8c1b8;border-radius:12px;
  color:var(--muted);background:#faf7f1
}
.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

.question-card{
  border-top:10px solid var(--accent);background:var(--white);padding:30px;
  box-shadow:0 9px 30px rgba(40,37,34,.06)
}
.topic-head{
  display:flex;justify-content:space-between;align-items:start;gap:18px;margin-bottom:10px
}
.index{display:inline-block;color:var(--accent);font-weight:800;letter-spacing:.14em;font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
.tag{
  border:1px solid #c8c1b8;border-radius:999px;padding:4px 9px;
  font-size:12px;color:var(--muted);background:#faf7f1
}
.prompt{font-size:19px;font-weight:700}
.cue{margin:20px 0 0;padding:18px 20px;background:var(--soft);border-left:4px solid var(--accent)}
.cue ul{margin:6px 0 0;padding-left:21px}
.section{padding:34px 0;border-bottom:1px solid #c8c1b8}
.section:last-child{border-bottom:0}
.section-title{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.section-title .num{font-size:12px;color:var(--accent);font-weight:800;letter-spacing:.12em}
.section-title h3{font-size:23px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{
  display:inline-flex;padding:8px 12px;border:1px solid #b8aea5;
  border-radius:999px;background:#faf7f1;font-size:14px
}
.answer{font-size:17px;max-width:780px}
.answer p{margin:0 0 16px}
.listen-row{display:flex;align-items:center;margin:0 0 20px}
.listen-btn{
  appearance:none;border:0;border-radius:999px;background:var(--accent);color:#fff;
  padding:10px 16px;font-size:14px;font-weight:800;letter-spacing:.02em;cursor:pointer
}
.listen-btn:hover{background:var(--accent-dark)}
.listen-btn:active{transform:translateY(1px)}
.phrase-list{display:grid;gap:12px}
.phrase{
  display:grid;grid-template-columns:minmax(210px,1fr) 1.2fr;
  gap:20px;padding:14px 0;border-top:1px solid #d6cec4
}
.phrase:first-child{border-top:0}
.phrase strong{font-size:15px}
.note{color:var(--muted);font-size:14px}
footer{
  margin-top:54px;background:var(--accent);color:#fff;padding:28px;
  display:flex;justify-content:space-between;gap:20px;align-items:end
}
footer b{letter-spacing:.08em}
footer span{font-size:13px;opacity:.85}

@media(max-width:680px){
  .page{padding:22px 16px 48px}
  .hero{padding:48px 0 32px}
  .topline{font-size:11px}
  .part-tab{padding:14px 7px;font-size:14px}
  .library{padding:20px 18px}
  .library-title{align-items:start;flex-direction:column;gap:4px}
  .controls{grid-template-columns:1fr}
  .search-row{grid-template-columns:1fr}
  .clear-btn{padding:10px 14px}
  .question-card{padding:22px 18px}
  .topic-head{flex-direction:column;gap:10px}
  .tags{justify-content:flex-start}
  .prompt{font-size:17px}
  .answer{font-size:16px}
  .phrase{grid-template-columns:1fr;gap:4px}
  footer{align-items:start;flex-direction:column}
}
</style>
</head>
<body>
<main class="page">
  <div class="topline">
    <span>IELTS SPEAKING · STUDY NOTES</span>
    <span>2026 / 10</span>
  </div>

  <header class="hero">
    <h1>SPEAKING <span class="accent">PRACTICE</span></h1>
    <div class="meta">
      <span>IELTS Speaking Library</span>
      <span id="totalCount">2 topics</span>
    </div>
  </header>

  <nav class="part-tabs" aria-label="IELTS Speaking Parts">
    <button class="part-tab" type="button" data-part="1">PART 1<span class="part-count" id="countP1">0 topics</span></button>
    <button class="part-tab active" type="button" data-part="2">PART 2<span class="part-count" id="countP2">2 topics</span></button>
    <button class="part-tab" type="button" data-part="3">PART 3<span class="part-count" id="countP3">0 topics</span></button>
  </nav>

  <section class="library" aria-label="題庫">
    <div class="library-title">
      <h2 id="libraryTitle">Part 2 題庫</h2>
      <span class="library-count" id="libraryCount">2 題</span>
    </div>

    <div class="controls">
      <div class="control">
        <label for="categorySelect" id="categoryLabel">CATEGORY</label>
        <select id="categorySelect"></select>
      </div>
      <div class="control">
        <label for="questionSelect">QUESTION</label>
        <select id="questionSelect"></select>
      </div>
    </div>

    <div class="search-row">
      <input id="searchInput" type="search" placeholder="全站搜尋題目、分類、標籤、關鍵字或重要句型…" autocomplete="off" />
      <button class="clear-btn" id="clearSearch" type="button">清除搜尋</button>
    </div>

    <div class="results" id="searchResults" hidden></div>
  </section>

  <article class="question-card" id="topicView" aria-live="polite"></article>

  <footer>
    <b>IELTS SPEAKING NOTES</b>
    <span id="footerTopic"></span>
  </footer>
</main>

<script>
const LIBRARY = [
  {
    id: "P2-PLACE-001",
    aliases: ["PLACE-001"],
    part: 2,
    category: "Place",
    topic: "Natural Beauty",
    tags: ["Natural Beauty", "Mountain", "Travel"],
    question: "Describe a place in your country that is famous for its natural beauty.",
    cuePoints: [
      "where that place is",
      "what kind of place it is",
      "what makes it beautiful",
      "and explain why this place is famous in your country"
    ],
    keywords: [
      "Alishan · Chiayi",
      "mountain area",
      "altitude increases",
      "wide variety of plants & trees",
      "huge old trees",
      "sunrise",
      "sea of clouds",
      "Alishan Forest Railway",
      "fresh mountain air",
      "peaceful atmosphere"
    ],
    answer: [
      "I would like to talk about Alishan, a famous mountain area in Chiayi, Taiwan. It is a very popular place for people who enjoy natural scenery and mountain views.",
      "What I really like about Alishan is its wide variety of plants and trees. One interesting feature is that the scenery gradually changes as the altitude increases. There are beautiful green forests and many huge old trees, which give the whole area a peaceful and relaxing atmosphere.",
      "When I visited Alishan, I had already heard a lot about its sunrise and the famous sea of clouds. However, the view was even more beautiful than I had expected. I had been looking forward to seeing it for a long time, so I got up very early in the morning. As the sun slowly came up, the clouds below gradually turned golden. It was definitely one of the most impressive views I had ever seen.",
      "Another thing I really enjoyed was taking the famous Alishan Forest Railway. The little train went through the forest, and along the way, I could enjoy the fresh mountain air and the forest scenery around me.",
      "I think Alishan is famous because it offers beautiful scenery, a peaceful atmosphere, and a unique railway experience all in one place. That is why it has become one of the most popular destinations for both Taiwanese people and international tourists."
    ],
    phrases: [
      ["It is a very popular place for people who …","簡單自然地介紹「這是一個很受某類人歡迎的地方」，比直接用 be popular with 更好說出口。"],
      ["What I really like about … is …","自然帶出「我最喜歡的特色是……」，很適合 Part 2 展開描述。"],
      ["One interesting feature is that …","用 that 子句介紹特色，可以增加句型變化，又不需要使用困難單字。"],
      ["… gradually changes as the altitude increases.","用 as 表示「隨著……」，很適合描述環境、景色或情況逐漸改變。"],
      ["…, which give the whole area a … atmosphere.","which 關係子句可用來補充前面事物帶來的效果，讓描述更完整。"],
      ["I had already heard a lot about …","過去完成式：到「實際去阿里山」之前，我已經聽過很多相關資訊。"],
      ["… was even more beautiful than I had expected.","比較級搭配過去完成式，適合描述實際體驗超出原本預期。"],
      ["I had been looking forward to …","過去完成進行式：強調某個期待在過去持續了一段時間。"],
      ["Another thing I really enjoyed was …","非常實用的延伸句型，用來加入第二個體驗或亮點。"],
      ["… offers … all in one place.","用 offers 取代 has，搭配 all in one place，能讓總結更自然也更有層次。"],
      ["That is why …","完整形式的原因總結句，適合收尾，也符合這份筆記不使用縮寫的練習原則。"]
    ]
  },
  {
    id: "P2-MEDIA-001",
    aliases: ["MEDIA-001"],
    part: 2,
    category: "Media",
    topic: "Film",
    tags: ["Film", "Society", "Korea"],
    question: "Describe a film you found interesting.",
    cuePoints: [
      "when you saw this film",
      "why you decided to see this film",
      "what happened in the film",
      "and explain why you found this film interesting"
    ],
    keywords: [
      "Parasite",
      "Korean film",
      "a lot of buzz",
      "poor family",
      "make ends meet",
      "wealthy family",
      "secure jobs",
      "infiltrate a wealthy household",
      "rich and poor",
      "makes me think"
    ],
    answer: [
      "I remember watching the Korean film <em>Parasite</em> a few years ago, mainly because of all the buzz it had generated overseas. There had been so much discussion about it that I became curious and decided to watch it. In the end, I felt that all the buzz was definitely worth it because the film was extraordinary.",
      "The story follows a poor family living in a low-income area of Seoul, South Korea. There are four members in the family: a mother, a father, and their two children, a son and a daughter. They struggle to make ends meet and even fold pizza boxes to earn some extra money just to survive.",
      "Their lives begin to change when the son gets an opportunity to work as a private tutor for the daughter of a wealthy family. This opens the door for the other members of his family to secure jobs working for the same household. The film essentially follows this poor family as they infiltrate a wealthy household, doing everything they can to work for them and make money.",
      "What I find especially interesting about this film is the way it shows the huge difference between rich and poor people. It is not only about life in Korea, but also about society in general. I think the film gives a powerful picture of modern society and reminds people to appreciate what they have, while also showing how difficult life can be for people who are less fortunate.",
      "For these reasons, I think <em>Parasite</em> is a fantastic film. I have watched it more than five times, and I still enjoy it every time. Whenever I watch it again, I notice something new. It is the kind of film that really makes me think."
    ],
    phrases: [
      ["I remember watching … a few years ago.","自然地交代過去的觀影經驗，也可以直接回答 when you saw this film。"],
      ["There had been so much discussion about it that …","使用過去完成式搭配 so … that …，表達「在我看之前已經有很多討論，因此我……」。"],
      ["all the buzz was definitely worth it","<b>buzz</b> 在這裡指話題度、熱度或大量討論。常見搭配有 a lot of buzz、generate buzz、create buzz。"],
      ["struggle to make ends meet","<b>make ends meet</b> 是固定片語，意思是「勉強維持生計、讓收支打平」。struggle to make ends meet 表示經濟上過得很辛苦。"],
      ["This opens the door for … to …","表示某件事為後續「創造機會」，很適合描述故事如何一步一步發展。"],
      ["secure jobs working for the same household","secure 在這裡是「成功取得」的意思；secure a job 比 get a job 稍正式，但在這段情境很自然。"],
      ["as they infiltrate a wealthy household","<b>infiltrate</b> 指「滲透、逐步潛入某個群體或組織」，帶有不是單純公開進入的語感，很貼合這部電影的情節。"],
      ["What I find especially interesting about this film is …","直接回答「為什麼覺得這部電影有趣」，很適合進入 Part 2 最後的評價段落。"],
      ["It is not only about …, but also about …","把觀點從單一故事延伸到更大的社會層次，句型簡單但很實用。"],
      ["Whenever I watch it again, I notice something new.","用 whenever 表達「每次……都……」，也讓重看多次這個個人細節更自然。"],
      ["It is the kind of film that really makes me think.","很適合電影題的自然收尾，簡單但能清楚表達這部電影帶來的思考。"]
    ]
  }
];

const PART_CONFIG = {
  1:{title:"Part 1 題庫", filterLabel:"TOPIC", empty:"Part 1 的內容之後會加入這裡。"},
  2:{title:"Part 2 題庫", filterLabel:"CATEGORY", empty:"目前還沒有 Part 2 題目。"},
  3:{title:"Part 3 題庫", filterLabel:"DISCUSSION TOPIC", empty:"Part 3 的內容之後會加入這裡。"}
};

const partTabs = [...document.querySelectorAll(".part-tab")];
const categorySelect = document.getElementById("categorySelect");
const categoryLabel = document.getElementById("categoryLabel");
const questionSelect = document.getElementById("questionSelect");
const searchInput = document.getElementById("searchInput");
const searchResults = document.getElementById("searchResults");
const clearSearch = document.getElementById("clearSearch");
const topicView = document.getElementById("topicView");
const footerTopic = document.getElementById("footerTopic");
const libraryTitle = document.getElementById("libraryTitle");
const libraryCount = document.getElementById("libraryCount");

let activePart = 2;
let activeId = null;

function stripHtml(text){
  const div=document.createElement("div");
  div.innerHTML=text;
  return div.textContent||div.innerText||"";
}
function escapeHtml(text){
  return String(text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function getPartItems(part){return LIBRARY.filter(item=>item.part===part)}
function buildSearchText(item){
  const common=[item.id,item.part,item.category||"",item.topic||"",...(item.tags||[]),item.question||""];
  const details=[
    ...(item.cuePoints||[]),...(item.keywords||[]),
    ...(item.answer||[]).map(stripHtml),
    ...((item.phrases||[]).flat().map(stripHtml))
  ];
  return [...common,...details].join(" ").toLowerCase();
}
function updateCounts(){
  document.getElementById("totalCount").textContent=LIBRARY.length+" topics";
  [1,2,3].forEach(part=>{
    const n=getPartItems(part).length;
    document.getElementById("countP"+part).textContent=n+" topic"+(n===1?"":"s");
  });
}
function syncTabs(){
  partTabs.forEach(btn=>btn.classList.toggle("active",Number(btn.dataset.part)===activePart));
}
function populateFilters(preferredId){
  const config=PART_CONFIG[activePart];
  const items=getPartItems(activePart);
  libraryTitle.textContent=config.title;
  categoryLabel.textContent=config.filterLabel;
  libraryCount.textContent=items.length+" 題";

  if(!items.length){
    categorySelect.innerHTML='<option>尚無內容</option>';
    questionSelect.innerHTML='<option>尚無內容</option>';
    categorySelect.disabled=true;
    questionSelect.disabled=true;
    activeId=null;
    renderEmpty(config.empty);
    return;
  }

  categorySelect.disabled=false;
  questionSelect.disabled=false;
  const field=activePart===2?"category":"topic";
  const groups=[...new Set(items.map(item=>item[field]).filter(Boolean))].sort();
  categorySelect.innerHTML='<option value="ALL">All</option>'+groups.map(v=>'<option value="'+escapeHtml(v)+'">'+escapeHtml(v)+'</option>').join("");

  const preferred=items.find(item=>item.id===preferredId);
  categorySelect.value=preferred ? preferred[field] : "ALL";
  populateQuestions(preferredId);
}
function filteredItems(){
  const items=getPartItems(activePart);
  if(categorySelect.value==="ALL") return items;
  const field=activePart===2?"category":"topic";
  return items.filter(item=>item[field]===categorySelect.value);
}
function populateQuestions(preferredId){
  const items=filteredItems();
  questionSelect.innerHTML=items.map(item=>'<option value="'+item.id+'">'+escapeHtml(item.topic||item.category||"Topic")+" — "+escapeHtml(item.question)+'</option>').join("");
  const chosen=items.find(item=>item.id===preferredId)||items[0];
  if(chosen){
    questionSelect.value=chosen.id;
    activeId=chosen.id;
    renderItem(chosen.id);
  }
}
function renderEmpty(message){
  topicView.innerHTML='<div class="empty"><strong>尚無內容</strong><span>'+escapeHtml(message)+'</span></div>';
  footerTopic.textContent="Part "+activePart;
  history.replaceState(null,"","#PART-"+activePart);
}
function renderItem(id,updateHash=true){
  const item=LIBRARY.find(x=>x.id===id);
  if(!item){renderEmpty(PART_CONFIG[activePart].empty);return}
  activePart=item.part;activeId=item.id;syncTabs();

  const tags=(item.tags||[]).map(tag=>'<span class="tag">'+escapeHtml(tag)+'</span>').join("");
  const cue=(item.cuePoints||[]).map(point=>'<li>'+escapeHtml(point)+'</li>').join("");
  const keywords=(item.keywords||[]).map(keyword=>'<span class="chip">'+escapeHtml(keyword)+'</span>').join("");
  const answers=(item.answer||[]).map(p=>'<p>'+p+'</p>').join("");
  const phrases=(item.phrases||[]).map(([phrase,note])=>'<div class="phrase"><strong>'+phrase+'</strong><span class="note">'+note+'</span></div>').join("");

  topicView.innerHTML=
    '<div class="topic-head">'+
      '<span class="index">PART '+item.part+' / '+escapeHtml(item.category||item.topic||"")+'</span>'+
      '<div class="tags">'+tags+'</div>'+
    '</div>'+
    '<section class="section"><div class="section-title"><span class="num">01</span><h3>題目</h3></div>'+
      '<div class="prompt">'+escapeHtml(item.question)+'</div>'+
      (cue?'<div class="cue"><strong>You should say:</strong><ul>'+cue+'</ul></div>':'')+
    '</section>'+
    '<section class="section"><div class="section-title"><span class="num">02</span><h3>關鍵字</h3></div><div class="chips">'+keywords+'</div></section>'+
    '<section class="section"><div class="section-title"><span class="num">03</span><h3>擬答</h3></div><div class="answer">'+
      '<div class="listen-row"><button class="listen-btn" id="readAnswerBtn" type="button">▶ Read aloud</button></div>'+
      '<div id="answerText">'+answers+'</div></div></section>'+
    '<section class="section"><div class="section-title"><span class="num">04</span><h3>重要句型</h3></div><div class="phrase-list">'+phrases+'</div></section>';

  footerTopic.textContent="Part "+item.part+" · "+(item.topic||item.category);
  document.getElementById("readAnswerBtn").addEventListener("click",speakCurrentAnswer);
  if(updateHash) history.replaceState(null,"","#"+item.id);
}
function setPart(part,preferredId){
  activePart=part;syncTabs();populateFilters(preferredId);
}
function renderSearchResults(query){
  const q=query.trim().toLowerCase();
  if(!q){searchResults.hidden=true;searchResults.innerHTML="";return}
  const matches=LIBRARY.filter(item=>buildSearchText(item).includes(q));
  searchResults.hidden=false;
  if(!matches.length){searchResults.innerHTML='<div class="empty">找不到符合的題目。</div>';return}
  searchResults.innerHTML=matches.map(item=>
    '<button class="result-card" type="button" data-id="'+item.id+'">'+
      '<span class="result-meta">PART '+item.part+' · '+escapeHtml(item.topic||item.category||"")+'</span>'+
      '<strong>'+escapeHtml(item.question)+'</strong>'+
      '<span>'+((item.tags||[]).map(escapeHtml).join(" · "))+'</span>'+
    '</button>'
  ).join("");
  searchResults.querySelectorAll(".result-card").forEach(btn=>{
    btn.addEventListener("click",()=>{
      const item=LIBRARY.find(x=>x.id===btn.dataset.id);
      if(!item)return;
      searchInput.value="";renderSearchResults("");
      setPart(item.part,item.id);
      window.scrollTo({top:topicView.offsetTop-18,behavior:"smooth"});
    });
  });
}
function resolveHash(){
  const hash=decodeURIComponent(location.hash.replace("#",""));
  if(!hash)return null;
  const direct=LIBRARY.find(item=>item.id===hash);
  if(direct)return direct;
  return LIBRARY.find(item=>(item.aliases||[]).includes(hash))||null;
}
function getBritishFemaleVoice(){
  const voices=window.speechSynthesis.getVoices();
  const preferred=["Serena","Samantha","Martha","Kate","Stephanie","Google UK English Female","Microsoft Sonia Online","Microsoft Libby Online"];
  for(const name of preferred){
    const found=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en-gb")&&v.name.toLowerCase().includes(name.toLowerCase()));
    if(found)return found;
  }
  const hints=["female","serena","martha","kate","sonia","libby","susan","fiona","victoria"];
  const female=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en-gb")&&hints.some(h=>v.name.toLowerCase().includes(h)));
  return female||voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en-gb"))||null;
}
function speakCurrentAnswer(){
  const btn=document.getElementById("readAnswerBtn");
  if(!("speechSynthesis" in window)){alert("Speech playback is not supported in this browser.");return}
  if(window.speechSynthesis.speaking){window.speechSynthesis.cancel();btn.textContent="▶ Read aloud";return}
  const text=document.getElementById("answerText").innerText.replace(/\s+/g," ").trim();
  const utterance=new SpeechSynthesisUtterance(text);
  const voice=getBritishFemaleVoice();
  if(voice)utterance.voice=voice;
  utterance.lang="en-GB";utterance.rate=.88;utterance.pitch=.92;utterance.volume=1;
  utterance.onstart=()=>{btn.textContent="■ Stop"};
  utterance.onend=()=>{btn.textContent="▶ Read aloud"};
  utterance.onerror=()=>{btn.textContent="▶ Read aloud"};
  window.speechSynthesis.speak(utterance);
}

partTabs.forEach(btn=>btn.addEventListener("click",()=>setPart(Number(btn.dataset.part))));
categorySelect.addEventListener("change",()=>populateQuestions());
questionSelect.addEventListener("change",()=>renderItem(questionSelect.value));
searchInput.addEventListener("input",e=>renderSearchResults(e.target.value));
clearSearch.addEventListener("click",()=>{searchInput.value="";renderSearchResults("");searchInput.focus()});
window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();

updateCounts();
const initial=resolveHash();
if(initial){setPart(initial.part,initial.id)}
else{setPart(2,"P2-PLACE-001")}
</script>
</body>
